name: Manually Run Python Script

on:
  workflow_dispatch:
    inputs:
      script_path:
        description: 'Path to the script to run (e.g. scripts/fetch_rolling_stats.py)'
        required: false
        default: 'scripts/log_games.py'

# Shares daily-data-pipeline's concurrency group so a manual run (this
# workflow defaults to running log_games.py) can never race against a
# scheduled daily_data.yml run or update_scores.yml -- confirmed live on
# 2026-08-27/28 as a real source of data loss (a manual grading push
# landing mid-run of another workflow got silently overwritten when that
# run finished and pushed its own stale local snapshot).
concurrency:
  group: daily-data-pipeline
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Python script
        # GITHUB_TOKEN is needed here specifically for log_games.py's
        # refresh_preserve_fields_from_remote() -- see that function's
        # docstring. Harmless for any other script that doesn't use it.
        run: python ${{ github.event.inputs.script_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit any new/changed data files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "Manual run: ${{ github.event.inputs.script_path }} [bot]"
          git push || echo "Nothing to push"
