name: MLB Daily Data

on:
  schedule:
    - cron: '0 13 * * *'    # 8:00 AM CT  (full run — stats + bullpen + batting)
    - cron: '0 16 * * *'    # 11:00 AM CT (mid-morning refresh)
    - cron: '0 19 * * *'    # 2:00 PM CT  (afternoon refresh)
    - cron: '0 22 * * *'    # 5:00 PM CT  (pre-game refresh)
    - cron: '0 13 * * 1'    # 8:00 AM CT Monday only (team platoon splits —
                            # weekly, not daily; see fetch_team_platoon.py)
  workflow_dispatch:

# Prevents overlapping runs from racing to commit/push at the same time.
# Root cause of the 2026-08-03 15:37 UTC failure: GitHub's scheduler fired
# the same trigger twice ~2 minutes apart (a known cron-scheduling quirk),
# and with no concurrency guard, both runs fetched data and tried to push
# independently -- one lost the race even with the existing 5-attempt
# fetch/rebase retry loop in the "Commit and push" step. Queuing (rather
# than cancelling) duplicate runs means a delayed/duplicate trigger simply
# waits its turn instead of being killed mid-run or fighting over the push.
concurrency:
  group: daily-data-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Fetch pitcher Statcast (stats.csv)
        continue-on-error: true
        run: python scripts/fetch_stats.py

      - name: Fetch exit velocity — batter + pitcher (exit_velocity_*.csv)
        continue-on-error: true
        run: python scripts/fetch_exit_velocity.py

      - name: Fetch batter Statcast + team batting with off_score (team_batting.csv)
        continue-on-error: true
        run: python scripts/fetch_statcast_hitting.py

      - name: Fetch bullpen xwOBA gaps (bullpen.csv)
        continue-on-error: true
        run: python scripts/fetch_bullpen.py

      - name: Fetch bullpen usage + fatigue (bullpen_fatigue.csv)
        continue-on-error: true
        run: python scripts/fetch_bullpen_usage.py

      - name: Fetch team platoon splits + pitcher handedness (team_platoon.csv, pitcher_hand.csv)
        continue-on-error: true
        run: python scripts/fetch_platoon_splits.py

      - name: Fetch team platoon splits vs LHP/RHP -- REBUILD (team_platoon.csv)
        # Weekly only (Monday 8am CT slot) + manual dispatch. This REPLACES
        # fetch_platoon_splits.py's team_platoon.csv output (which has been
        # silently empty all season -- see commit history for
        # fetch_team_platoon.py). Runs weekly not daily because (a) it's a
        # full season-to-date pull, ~29 chunks, ~18 minutes, and (b) team-
        # level platoon tendency vs LHP/RHP is stable day to day, so a
        # week-old snapshot is still highly relevant. The step above still
        # runs daily for pitcher_hand.csv, which works fine and is cheap.
        if: github.event.schedule == '0 13 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/fetch_team_platoon.py

      - name: Fetch injury/roster transaction notes (injury_notes.csv)
        continue-on-error: true
        run: python scripts/fetch_injury_notes.py

      - name: Fetch rolling (21-day) pitcher stats (rolling_stats.csv)
        # Once/day only (8:00 AM CT slot) -- this is a heavier multi-chunk pull
        # against Baseball Savant's pitch-level search than the other single-
        # request fetches above, and the 21-day rolling window barely moves
        # within a single day, so refreshing it 4x/day like the others would
        # just add unnecessary load risk for no real benefit.
        if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/fetch_rolling_stats.py

      - name: Log all games with composite scores (game_log.csv)
        # GITHUB_TOKEN is required here for refresh_preserve_fields_from_remote()
        # in log_games.py -- fixes a real race condition (confirmed live on
        # 2026-08-27 and again 2026-08-28) where a manual grading push landing
        # mid-run gets silently overwritten by this run's own stale local-
        # checkout snapshot when it later pushes. See log_games.py for details.
        run: python scripts/log_games.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name  "MLB Data Bot"
          git config user.email "bot@mlb-data"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily data $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully (attempt $i)"
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Push failed after 5 attempts — giving up"
              exit 1
            fi
            echo "Push rejected (attempt $i) — remote has new commits, rebasing and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflict — needs manual resolution, aborting"
              exit 1
            fi
            sleep $((RANDOM % 5 + 2))
          done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
